# A Blipkeep installation as a Docker Swarm stack.
#
#   docker stack deploy -c stack.yml --with-registry-auth tinymon
#
# The file lives in server/priv/ rather than deploy/ on purpose: from there it
# ends up inside the server image, so the panel deploys from one image alone
#
#   docker run --rm <image> cat /app/bin/bootstrap | bash -s -- --host <address>
#
# deploy/deploy.sh and bootstrap use this same file — no copies to diverge.
#
# Values come from .env — fill it in following .env.example.

version: "3.8"

services:
  tinymon:
    image: ${TINYMON_IMAGE:-tinymon-server}:${TINYMON_VERSION:-latest}

    environment:
      DATABASE_URL: postgres://tinymon:${POSTGRES_PASSWORD}@db:5432/tinymon
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST}
      PORT: "4000"
      # Scheme used in the links sent to Telegram: behind a reverse proxy it
      # differs from the one the server itself listens on
      PHX_SCHEME: ${PHX_SCHEME:-http}
      # Port used in links. With https and no value, 443 is assumed, while a
      # panel terminating TLS itself usually keeps its own port — that is how
      # the self-update command once reached agents with the port missing
      PHX_URL_PORT: ${PHX_URL_PORT:-}
      TINYMON_ADMIN_EMAIL: ${ADMIN_EMAIL}
      # The header carrying a client address that can be trusted. Set it only
      # where a proxy in front of the panel overwrites that header: otherwise a
      # client sets its own address and bypasses the rate limiter
      TINYMON_CLIENT_IP_HEADER: ${TINYMON_CLIENT_IP_HEADER:-}
      # Built-in TLS instead of a reverse proxy. The paths point inside the
      # container; the certificate directory is mounted below. Empty — plain http.
      TINYMON_TLS_CERTFILE: ${TINYMON_TLS_CERTFILE:-}
      TINYMON_TLS_KEYFILE: ${TINYMON_TLS_KEYFILE:-}

    ports:
      - target: 4000
        published: ${PUBLISHED_PORT:-4000}
        protocol: tcp
        # host rather than ingress: the Swarm ingress network replaces the
        # source address with an internal one, and an enrollment request would
        # carry the overlay router's address instead of the agent's IP
        mode: host

    # The certificate directory is always mounted, but an empty one changes
    # nothing: TLS is switched on by the TINYMON_TLS_* variables. That keeps one
    # manifest for installations with and without a proxy.
    volumes:
      - type: bind
        source: ${TINYMON_TLS_DIR:-/etc/tinymon-tls}
        target: /etc/tinymon-tls
        read_only: true

    networks:
      - internal

    deploy:
      replicas: 1
      # One replica on purpose: several alert engines would evaluate the rules
      # in parallel and send duplicate notifications
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: stop-first
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD-SHELL", "/app/bin/tinymon rpc 'IO.puts(:ok)' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: timescale/timescaledb-ha:pg17

    environment:
      POSTGRES_USER: tinymon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tinymon
      # Fewer checkpoints: the metric stream writes constantly, and aggressive
      # checkpointing loads the disk for nothing
      POSTGRES_INITDB_ARGS: "--data-checksums"

    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - max_connections=100
      # TimescaleDB background jobs: compression and aggregate refreshes
      - -c
      - timescaledb.max_background_workers=8

    volumes:
      - db_data:/home/postgres/pgdata/data

    networks:
      - internal

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tinymon -d tinymon"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: overlay
    # A fully internal network will not do: the server needs api.telegram.org
    # for notifications
    attachable: false

volumes:
  db_data:
    driver: local
