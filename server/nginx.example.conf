# Example nginx configuration in front of a Blipkeep panel.
#
# Replace mon.example.com with your own address, put this in
# /etc/nginx/sites-available/mon.example.com and link it into sites-enabled.
# Issue the certificate with certbot:
#
#   sudo certbot --nginx -d mon.example.com
#
# Port 4000 is the PUBLISHED_PORT value from the panel's .env.

# Upgrade to WebSocket also works when the Connection header is empty
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name mon.example.com;

    # certbot will add the https redirect and the ACME challenge here
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mon.example.com;

    # certbot fills in the certificate paths on first issue
    # ssl_certificate     /etc/letsencrypt/live/mon.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mon.example.com/privkey.pem;

    # Long-lived WebSocket connections from agents and installations must not
    # be dropped on timeout: the server pings every 30 s on its own
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Federation packets are compressed at the protocol level; the body can
    # still be large when catching up after downtime
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Upgrade to WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;

        # The real client address: the panel records it in the enrollment
        # request and counts it in the rate limiter. The address is taken only
        # from the header named in TINYMON_CLIENT_IP_HEADER — here X-Real-IP.
        # Without that variable in .env the panel will not trust the header.
        proxy_set_header X-Real-IP $remote_addr;

        # $remote_addr rather than $proxy_add_x_forwarded_for: the latter
        # appends, leaving whatever the client sent in first position
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # With no Cloudflare in front of this nginx, a client-supplied value
        # would be taken for the source address — clear it
        proxy_set_header CF-Connecting-IP "";
    }
}
